spring.application.name=resumeanalyzer
server.port=8081

# Database Configuration
# Default to an in-memory H2 database so the project runs locally without MySQL installed.
# Override these values with real DB environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resume_analyzer;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
app.upload.dir=${APP_UPLOAD_DIR:uploads/resumes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration
app.jwtSecret=${JWT_SECRET:dev-jwt-secret-change-me-before-production-1234567890}
app.jwtExpirationInMs=${JWT_EXPIRATION_IN_MS:86400000}
